<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our cakes — Many Happy Returns</title>
<meta name="description" content="Celebration cakes, boxes for a table, and a builder for the one you have in your head.">

<link rel="preload" href="assets/fonts/fredoka.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/nunito.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components/chrome.css">
<link rel="stylesheet" href="css/components/controls.css">
<link rel="stylesheet" href="css/components/card.css">
<link rel="stylesheet" href="css/components/cake.css">
<link rel="stylesheet" href="css/components/overlay.css">
</head>
<body>

<a class="skip" href="#main">Skip to the cakes</a>

<header class="chrome" data-chrome></header>
<div class="allergen" data-allergens></div>

<main id="main">
  <div class="shell section--tight">
    <h1 class="t-2">Our cakes</h1>
    <p class="lede quiet" style="margin-top:var(--s-2);max-width:52ch">
      Nine things we make. Or
      <a href="build.html" data-build-link>build the one in your head</a>.
    </p>

    <!-- Occasion first, because that is what people arrive knowing. -->
    <h2 class="label" style="margin-top:var(--s-5)">What is it for?</h2>
    <div class="occasions" data-occasions role="group" aria-label="Filter by occasion"></div>

    <h2 class="label" style="margin-top:var(--s-4)">Kind</h2>
    <div class="occasions" data-cats role="group" aria-label="Filter by kind"></div>

    <form class="row" style="margin-top:var(--s-4)" data-searchform role="search">
      <label class="sr" for="q">Search the cakes</label>
      <input class="input" id="q" type="search" data-search placeholder="Chocolate, vegan, cupcakes…"
        style="max-width:340px" autocomplete="off">
      <p class="sm quiet" aria-live="polite" data-found></p>
    </form>
  </div>

  <div class="shell section--tight">
    <div class="grid" data-shelf></div>
  </div>
</main>

<footer class="footer" data-footer></footer>

<script type="module" src="js/pages/shop.js"></script>
</body>
</html>
