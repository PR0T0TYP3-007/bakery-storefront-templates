<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No cake here — Many Happy Returns</title>
<meta name="robots" content="noindex">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components/controls.css">
<link rel="stylesheet" href="css/components/card.css">
<style>
  /* A 404 has no session to boot, so it is the one page in the template
     that carries its own few lines of layout rather than rendering chrome. */
  body { display: grid; place-items: center; min-height: 100svh; padding: var(--s-5); }
  .lost { text-align: center; max-width: 46ch; }
  .lost svg { margin-inline: auto; }
</style>
</head>
<body>

<main class="lost">
  <svg width="180" height="150" viewBox="60 230 240 180" aria-hidden="true" focusable="false">
    <ellipse cx="180" cy="404" rx="110" ry="12" fill="#fff" stroke="var(--ink)" stroke-width="3"/>
    <!-- An empty stand. The joke is the point: there is nothing on it. -->
    <path d="M150 398 h60 l-6 -22 h-48 Z" fill="#fff" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M110 376 h140" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
    <path d="M124 356 q12 -14 24 0" fill="none" stroke="var(--berry)" stroke-width="3" stroke-linecap="round"/>
    <path d="M168 348 q12 -14 24 0" fill="none" stroke="var(--grape)" stroke-width="3" stroke-linecap="round"/>
    <path d="M212 356 q12 -14 24 0" fill="none" stroke="var(--mint)" stroke-width="3" stroke-linecap="round"/>
  </svg>

  <h1 class="t-1" style="margin-top:var(--s-4)">Nothing on this stand.</h1>
  <p class="lede" style="margin-top:var(--s-4)">
    That page has been eaten, moved, or never existed. The cakes are all still where
    you left them.
  </p>

  <div class="row" style="justify-content:center;margin-top:var(--s-5)">
    <a class="btn btn--loud" href="build.html">Build a cake</a>
    <a class="btn" href="index.html">Back to the shop</a>
  </div>
</main>

</body>
</html>
