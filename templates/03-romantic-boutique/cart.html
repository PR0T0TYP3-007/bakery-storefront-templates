<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your basket &mdash; Postscript</title>
<meta name="description" content="What you have chosen, what is written on it, and when it will be ready.">
<link rel="preload" href="assets/fonts/julius-sans-one.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/karla.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components/chrome.css">
<link rel="stylesheet" href="css/components/controls.css">
<link rel="stylesheet" href="css/components/cake.css">
<link rel="stylesheet" href="css/components/letter.css">
<link rel="stylesheet" href="css/components/overlay.css">
<link rel="stylesheet" href="css/pages/pages.css">
</head>
<body>

<a class="skip" href="#main">Skip to the content</a>

<header class="masthead" data-masthead></header>

<main id="main">

  <section class="band band--tight page">
    <h1 class="t-1">Your basket</h1>
  </section>

  <section class="band band--tight page">
    <div class="checkout" data-filled hidden>
      <div>
        <div data-lines></div>
        <p class="note note--warn" data-stale hidden></p>
      </div>

      <aside class="checkout__aside stack stack--loose">
        <div class="mark"><h2 class="label">The order</h2></div>
        <p class="note" data-ready></p>
        <dl class="totals" data-totals></dl>
        <a class="btn btn--blush btn--wide" href="checkout.html" data-checkout-link>Checkout</a>
        <p class="sm dimmer" data-tax></p>
      </aside>
    </div>

    <div class="measure" data-nothing hidden>
      <p class="lede">There is nothing in it yet.</p>
      <p style="margin-top:var(--s-5)"><a class="btn btn--blush" href="cakes.html" data-cakes-link>See the cakes</a></p>
    </div>
  </section>
</main>

<div class="allergen" data-allergens></div>
<footer class="band band--tight" data-footer></footer>

<script type="module" src="js/pages/cart.js"></script>
</body>
</html>
