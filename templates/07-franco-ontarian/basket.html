<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Votre panier — Boulangerie Tremblay</title>
<meta name="description" content="Ce que vous nous avez demandé de mettre de côté.">
<meta name="robots" content="noindex">

<link rel="preload" href="assets/fonts/rye.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/librefranklin.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components/chrome.css">
<link rel="stylesheet" href="css/components/plates.css">
<link rel="stylesheet" href="css/components/controls.css">
<link rel="stylesheet" href="css/components/order.css">
</head>
<body>
<a class="skip" href="#basket" data-skip></a>
<div data-header></div>

<main id="main">
  <section class="band band--enamel-2 section" id="basket">
    <div class="wrap">
      <h1 class="t-1 sign" data-head></h1>

      <div class="order" data-order hidden>
        <div class="order__lines" data-lines></div>

        <aside class="order__side">
          <!-- The collection day sits with the total rather than being
               asked for at checkout: when you are coming is as much the
               order as what is in it. -->
          <section class="plate when" aria-labelledby="when-h">
            <h2 class="label" id="when-h" data-when-label></h2>
            <p class="when__day t-3 sign" data-when-day>—</p>

            <label class="vh" for="when" data-when-input-label></label>
            <input class="when__in" id="when" type="date" data-when>

            <p class="when__note sm" role="status" data-when-note></p>
            <p class="sm dim when__where" data-where></p>
          </section>

          <section class="plate plate--blueberry totals" aria-labelledby="total-h">
            <h2 class="label" id="total-h" data-total-label></h2>
            <dl class="totals__list" data-totals></dl>
            <a class="btn btn--quiet btn--block" href="checkout.html" data-go></a>
          </section>
        </aside>
      </div>

      <div data-empty hidden>
        <p class="lede" style="margin-top:var(--s-4)" data-empty-text></p>
        <p style="margin-top:var(--s-5)">
          <a class="btn" href="shop.html" data-empty-link></a>
        </p>
      </div>

      <noscript>
        <p class="plate" style="margin-top:var(--s-5)">
          Le panier a besoin de JavaScript. Téléphonez-nous au 705 555 0161.
          <br>The basket needs JavaScript. Call us at 705 555 0161.
        </p>
      </noscript>
    </div>
  </section>
</main>

<footer data-footer></footer>

<script type="module" src="js/pages/basket.js"></script>
</body>
</html>
