<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nous trouver — Boulangerie Tremblay</title>
<meta name="description" content="Rue Principale, Hearst. Les heures, comment venir, et ce que c'est comme place.">

<link rel="preload" href="assets/fonts/rye.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/librefranklin.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components/chrome.css">
<link rel="stylesheet" href="css/components/plates.css">
<link rel="stylesheet" href="css/components/controls.css">
<link rel="stylesheet" href="css/components/visit.css">
</head>
<body>
<a class="skip" href="#hours" data-skip></a>
<div data-header></div>

<main id="main">

  <section class="wrap section">
    <p class="label" data-kicker></p>
    <h1 class="t-hero sign" style="margin-top:var(--s-3);max-width:14ch" data-head></h1>
    <p class="lede" style="margin-top:var(--s-4)" data-lede></p>
  </section>

  <!-- The room, before the hours. Somebody deciding whether to drive in
       wants to see the place first; the table answers the second question,
       not the first. -->
  <img class="band-shot" src="assets/img/counter-lg.jpg" alt=""
       width="1600" height="2484" loading="lazy" decoding="async" data-room-shot>

  <!-- ====================================================================
       Hours. Today's row is marked, because that is the question almost
       everybody on this page is actually asking.
       ==================================================================== -->
  <section class="band band--enamel section" id="hours">
    <div class="wrap split split--wide-left">
      <div>
        <div class="sechead">
          <div class="sechead__title">
            <h2 class="t-1 sign" data-hours-head></h2>
            <p class="label dim" data-today></p>
          </div>
        </div>

        <table class="hours plate">
          <caption class="vh" data-hours-caption></caption>
          <tbody data-hours></tbody>
        </table>

        <p class="plate plate--2" style="margin-top:var(--s-5)" data-shut hidden></p>
      </div>

      <div>
        <p class="label dim" data-room-label></p>
        <p class="prose" style="margin-top:var(--s-3)" data-room></p>

        <p class="label dim" style="margin-top:var(--s-6)" data-lang-label></p>
        <p class="prose" style="margin-top:var(--s-3)" data-lang-note></p>

        <p class="label dim" style="margin-top:var(--s-6)" data-call-label></p>
        <p class="t-2 sign" style="margin-top:var(--s-2)">
          <a class="link" data-phone href="#">—</a>
        </p>
      </div>
    </div>
  </section>

  <!-- ====================================================================
       Getting here
       ==================================================================== -->
  <section class="band band--rim section on-dark">
    <div class="wrap">
      <div class="sechead">
        <div class="sechead__title">
          <h2 class="t-1 sign" data-ways-head></h2>
        </div>
      </div>

      <dl class="ways" data-ways></dl>

      <p class="sm" style="margin-top:var(--s-6)">
        <span data-address>—</span>
        · <a class="link" data-map href="#" target="_blank" rel="noopener noreferrer" data-map-text></a>
      </p>
    </div>
  </section>

</main>

<footer data-footer></footer>

<script type="module" src="js/pages/visit.js"></script>
</body>
</html>
