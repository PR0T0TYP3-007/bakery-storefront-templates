<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forn de la Plaça — bread and pastry in Poble-sec</title>
<meta name="description" content="A neighbourhood bakery on Carrer de Blai, Poble-sec, Barcelona, since 1954. The calendar decides: tortell for Reis, bunyols through Lent, coca for Sant Joan.">
<meta property="og:title" content="Forn de la Plaça — bread and pastry in Poble-sec">
<meta property="og:description" content="The calendar decides. Some things are only made when their day comes round.">

<link rel="preload" href="assets/fonts/zillaslab.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/sourcesans.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components/chrome.css">
<link rel="stylesheet" href="css/components/calendar.css">
<link rel="stylesheet" href="css/components/controls.css">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Bakery",
  "name": "Forn de la Plaça",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "Carrer de Blai 44",
    "addressLocality": "Barcelona",
    "postalCode": "08004",
    "addressCountry": "ES"
  },
  "servesCuisine": "Bakery",
  "priceRange": "€"
}
</script>
</head>
<body>
<a class="skip" href="#now">Skip to the counter</a>
<div data-header></div>

<main id="main">

  <!-- ====================================================================
       The claim.

       Short, because the page's real content is the counter and the counter
       is immediately below it. "The calendar decides" is the whole template
       in three words, and the sentence under it says the consequence rather
       than explaining the charm.
       ==================================================================== -->
  <section class="wrap section hero">
    <div>
      <p class="label dim" data-kicker>Carrer de Blai, Poble-sec · Since 1954</p>
      <h1 class="t-hero" style="margin-top:var(--s-3);max-width:14ch" data-headline>The calendar decides.</h1>
      <p class="lede" style="margin-top:var(--s-4)" data-lede></p>
    </div>

    <!-- The counter. Deliberately NOT lazy and NOT deferred: it is the
         first thing on the page, and Templates 03 and 05 both shipped a
         `loading="lazy"` hero that showed as an empty coloured box for
         seconds on a real network. The src is in the markup rather than
         painted on by JS for the same reason. -->
    <figure class="hero__shot">
      <img src="assets/img/counter-lg.jpg" alt="" fetchpriority="high" data-shopfront>
    </figure>
  </section>

  <!-- A band of the same floor. -->
  <div class="pattern" aria-hidden="true"></div>

  <!-- ====================================================================
       On the counter now.

       This is the shop. Everything the calendar has opened plus everything
       made every morning, on marble because marble is the surface that
       carries text here.
       ==================================================================== -->
  <section class="band band--marble-2 section" id="now">
    <div class="wrap">
      <div class="sechead">
        <div class="sechead__title">
          <h2 class="t-1">On the counter</h2>
          <p class="label dim" data-today>—</p>
        </div>
        <a class="link" href="shop.html">Everything we make</a>
      </div>

      <div class="shelf" data-now>
        <noscript>
          <p class="note">
            Today's counter needs JavaScript. Our
            <a href="visit.html">hours and address</a> are here either way,
            or call us on 93 441 00 00.
          </p>
        </noscript>
      </div>
    </div>
  </section>

  <!-- ====================================================================
       What is coming, with the days until it.

       The counterpart to the counter, and the reason the template exists: a
       Catalan bakery is as much a schedule as a shop. Asking for a tortell
       in March gets you the date it comes back rather than a "sold out".
       ==================================================================== -->
  <section class="wrap section" id="coming">
    <div class="sechead">
      <div class="sechead__title">
        <h2 class="t-1">What's coming</h2>
      </div>
      <a class="link" href="calendar.html">The whole year</a>
    </div>
    <ol class="coming" data-coming></ol>
  </section>

  <!-- ====================================================================
       The bakery, briefly.
       ==================================================================== -->
  <section class="band band--tile-3 section">
    <div class="wrap split split--wide-left">
      <div>
        <p class="label dim">The bakery</p>
        <p class="t-2" style="margin-top:var(--s-3)" data-shop-head></p>
        <figure class="shopnote__shot">
          <img src="assets/img/obrador-md.jpg" alt="" loading="lazy" decoding="async" data-shop-img>
        </figure>
      </div>
      <div class="prose" data-shop-body></div>
    </div>
  </section>

</main>

<footer data-footer></footer>

<script type="module" src="js/pages/home.js"></script>
</body>
</html>
