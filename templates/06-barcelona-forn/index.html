<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forn de la Plaça — bread and pastry in Poble-sec</title>
<meta name="description" content="A neighbourhood bakery on Carrer de Blai, Poble-sec, Barcelona, since 1954. The calendar decides: tortell for Reis, bunyols through Lent, coca for Sant Joan.">
<meta property="og:title" content="Forn de la Plaça — bread and pastry in Poble-sec">
<meta property="og:description" content="The calendar decides. Some things are only made when their day comes round.">

<link rel="preload" href="assets/fonts/zillaslab.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/sourcesans.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components/chrome.css">
<link rel="stylesheet" href="css/components/calendar.css">
<link rel="stylesheet" href="css/components/controls.css">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Bakery",
  "name": "Forn de la Plaça",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "Carrer de Blai 44",
    "addressLocality": "Barcelona",
    "postalCode": "08004",
    "addressCountry": "ES"
  },
  "servesCuisine": "Bakery",
  "priceRange": "€"
}
</script>
</head>
<body>
<a class="skip" href="#now">Skip to the counter</a>
<div data-header></div>

<main id="main">

  <!-- ====================================================================
       The hero.

       It was a claim on a flat blue field with a photograph in a box beside
       it, which is a layout, not a design — the room was a thumbnail and the
       page had no warmth anywhere in it.

       Now the room IS the hero: full bleed, type set into it, and the blue
       ground washing in from the left so the photograph and the page are one
       surface instead of two. The floor runs along the bottom edge as the
       join, the way the tiles meet the wall in the shop itself.
       ==================================================================== -->
  <section class="hero">
    <img class="hero__img" src="assets/img/room-lg.jpg" alt="" fetchpriority="high" data-shopfront>
    <div class="hero__wash" aria-hidden="true"></div>

    <div class="wrap hero__words">
      <p class="label hero__kicker" data-kicker>Carrer de Blai, Poble-sec · Since 1954</p>
      <h1 class="t-hero hero__claim" data-headline>Coffee every morning. Cake when its day comes.</h1>
      <p class="lede hero__lede" data-lede></p>

      <p class="hero__motto" lang="ca" data-motto></p>
    </div>

    <!-- The floor, along the join. -->
    <div class="pattern hero__floor" aria-hidden="true"></div>
  </section>


  <!-- ====================================================================
       On the counter now.

       This is the shop. Everything the calendar has opened plus everything
       made every morning, on marble because marble is the surface that
       carries text here.
       ==================================================================== -->
  <section class="band band--marble-2 section" id="now">
    <div class="wrap">
      <div class="sechead">
        <div class="sechead__title">
          <h2 class="t-1">On the counter</h2>
          <p class="label dim" data-today>—</p>
        </div>
        <a class="link" href="shop.html">Everything we make</a>
      </div>

      <div class="shelf" data-now>
        <noscript>
          <p class="note">
            Today's counter needs JavaScript. Our
            <a href="visit.html">hours and address</a> are here either way,
            or call us on 93 441 00 00.
          </p>
        </noscript>
      </div>
    </div>
  </section>

  <!-- ====================================================================
       To drink.

       The half of the shop the first build left out entirely. A forn in
       Barcelona is where the street has breakfast standing at the counter,
       and a page that only sells loaves is not that place.

       It is a list, not a grid of tiles: six things at four prices, read
       top to bottom like the card propped on the counter.
       ==================================================================== -->
  <section class="band band--terracotta section" id="drink">
    <div class="wrap split split--wide-left">
      <div>
        <div class="sechead">
          <div class="sechead__title">
            <h2 class="t-1">To drink</h2>
          </div>
        </div>
        <dl class="card" data-drinks></dl>
      </div>

      <figure class="drink__shot">
        <img src="assets/img/cafe-sol-md.jpg" alt="A cup of black coffee on a marble counter"
             loading="lazy" decoding="async">
        <figcaption class="sm">Cafè sol, at the counter, standing up.</figcaption>
      </figure>
    </div>
  </section>

  <!-- ====================================================================
       What is coming, with the days until it.

       The counterpart to the counter, and the reason the template exists: a
       Catalan bakery is as much a schedule as a shop. Asking for a tortell
       in March gets you the date it comes back rather than a "sold out".
       ==================================================================== -->
  <section class="wrap section" id="coming">
    <div class="sechead">
      <div class="sechead__title">
        <h2 class="t-1">What's coming</h2>
      </div>
      <a class="link" href="calendar.html">The whole year</a>
    </div>
    <ol class="coming" data-coming></ol>
  </section>

  <!-- ====================================================================
       The bakery, briefly.
       ==================================================================== -->
  <section class="band band--tile-3 section">
    <div class="wrap split split--wide-left">
      <div>
        <p class="label dim">The bakery</p>
        <p class="t-2" style="margin-top:var(--s-3)" data-shop-head></p>
        <figure class="shopnote__shot">
          <img src="assets/img/obrador-md.jpg" alt="" loading="lazy" decoding="async" data-shop-img>
        </figure>
      </div>
      <div class="prose" data-shop-body></div>
    </div>
  </section>

</main>

<footer data-footer></footer>

<script type="module" src="js/pages/home.js"></script>
</body>
</html>
