<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The shop — Forn de la Plaça</title>
<meta name="description" content="Everything Forn de la Plaça makes: the bread and pastry of every morning, and the things made only when their day comes round.">

<link rel="preload" href="assets/fonts/zillaslab.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/sourcesans.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components/chrome.css">
<link rel="stylesheet" href="css/components/calendar.css">
<link rel="stylesheet" href="css/components/controls.css">
</head>
<body>
<a class="skip" href="#list">Skip to the list</a>
<div data-header></div>

<main id="main">

  <!-- ====================================================================
       The shop is not a catalogue with the seasonal things filtered out of
       it. It is the whole year on one page, with the things that are not
       available today still shown and still saying when they come back.
       That is the template's argument, so the shop has to make it too.
       ==================================================================== -->
  <section class="wrap section section--tight">
    <h1 class="t-1">The shop</h1>
    <p class="lede" style="margin-top:var(--s-3)">
      Everything we make, all year. Whatever isn't here today says when it's back.
    </p>
  </section>

  <!-- The filter. Square tiles, one surface against another: the chosen one
       is the dark tile and the rest are marble. No pill, no border, no
       underline — the fill is the state. -->
  <section class="band band--marble-2 section--tight">
    <div class="wrap">
      <nav class="filters" aria-label="Filter by kind" data-filters></nav>

      <form class="find" role="search" data-find>
        <label class="vh" for="q">Search the bakery</label>
        <input class="find__in" id="q" name="q" type="search" placeholder="Try: tortell, bread, coca…" autocomplete="off">
        <button class="btn" type="submit">Search</button>
      </form>
    </div>
  </section>

  <section class="band band--marble-2 section" id="list">
    <div class="wrap">
      <p class="label dim" aria-live="polite" data-count></p>
      <div style="margin-top:var(--s-4)" data-list>
        <noscript>
          <p class="note">
            The list needs JavaScript. Call us on 93 441 00 00 and we'll tell
            you what's in today, or see <a href="visit.html">our hours</a>.
          </p>
        </noscript>
      </div>
    </div>
  </section>

</main>

<footer data-footer></footer>

<script type="module" src="js/pages/shop.js"></script>
</body>
</html>
