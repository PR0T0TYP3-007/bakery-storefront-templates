<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Cake Themes Templates</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f3efe8; --ink:#17140f; --ink-2:#574f44; --ink-3:#857b6e;
          --line:rgba(23,20,15,.14); --accent:#8a3e2c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; display:grid; place-items:center;
         background:var(--paper); color:var(--ink);
         font-family:Inter,system-ui,sans-serif; line-height:1.6;
         -webkit-font-smoothing:antialiased; padding:clamp(1.5rem,5vw,4rem); }
  .wrap { max-width:46rem; text-align:center; }
  .meta { font-family:'IBM Plex Mono',monospace; font-size:.6875rem;
          letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3); }
  h1 { font-family:'Instrument Serif',serif; font-weight:400;
       font-size:clamp(2.5rem,8vw,5rem); line-height:.95; letter-spacing:-.03em;
       margin-top:1rem; }
  p { margin-top:1.25rem; color:var(--ink-2); max-width:44ch;
      margin-inline:auto; text-wrap:pretty; }
  .links { display:flex; flex-wrap:wrap; gap:.6rem; justify-content:center;
           margin-top:2.5rem; }
  a.btn { display:inline-flex; align-items:center; min-height:44px;
          padding:.85rem 1.4rem; background:var(--ink); color:var(--paper);
          border-radius:999px; text-decoration:none;
          font-family:'IBM Plex Mono',monospace; font-size:.75rem;
          letter-spacing:.12em; text-transform:uppercase;
          transition:background .18s cubic-bezier(.2,.7,.2,1); }
  a.btn:hover { background:var(--accent); }
  a.btn--quiet { background:transparent; color:var(--ink);
                 border:1px solid var(--line); }
  a.btn--quiet:hover { background:transparent; border-color:var(--ink);
                       color:var(--accent); }
  a.btn:focus-visible, a.btn--quiet:focus-visible {
    outline:3px solid var(--accent); outline-offset:3px; }
</style>
</head>
<body>
  <main class="wrap">
    <p class="meta">404</p>
    <h1>No such plate.</h1>
    <p>
      That page isn't in the catalogue. The link may be old, or the path may have
      a typo in it — these live under <code>/templates/</code>.
    </p>
    <div class="links">
      <a class="btn" href="/">All templates</a>
      <a class="btn btn--quiet" href="/templates/01-editorial-atelier/">Editorial Atelier</a>
      <a class="btn btn--quiet" href="/templates/05-neighbourhood/">Modern Neighbourhood Bakery</a>
    </div>
  </main>
</body>
</html>
