name: Deploy to GitHub Pages

# Pages can serve a branch directly, but this project has a build step:
# build.mjs assembles the listing page plus every template, leaving development
# files behind. So the site is built here and the result published, rather than
# committing dist/ to the repo.

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you redeploy from the Actions tab without a commit

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No dependencies to install — build.mjs uses only the Node standard
      # library, and the templates themselves have no build step at all.
      # --base is what makes the 404 page's links correct: a project Pages
      # site is served from /<repo>/, not the domain root.
      - name: Build
        run: node build.mjs --base "/${GITHUB_REPOSITORY#*/}/"

      - name: Check the build produced something usable
        run: |
          test -f dist/index.html  || { echo "::error::listing page missing"; exit 1; }
          test -f dist/404.html    || { echo "::error::404 missing"; exit 1; }
          test -f dist/.nojekyll   || { echo "::error::.nojekyll missing"; exit 1; }
          test -d dist/shared/img  || { echo "::error::photography missing"; exit 1; }

          for t in 01-editorial-atelier 02-playful-celebration 03-romantic-boutique 04-creative-studio 05-neighbourhood; do
            test -f "dist/templates/$t/index.html"               || { echo "::error::template $t missing"; exit 1; }
          done

          # The listing page shows a screenshot of each template.
          test -f dist/assets/previews/template-01.jpg || { echo "::error::preview 01 missing"; exit 1; }
          test -f dist/assets/previews/template-02.jpg || { echo "::error::preview 02 missing"; exit 1; }
          test -f dist/assets/previews/template-03.jpg || { echo "::error::preview 03 missing"; exit 1; }
          test -f dist/assets/previews/template-04.jpg || { echo "::error::preview 04 missing"; exit 1; }
          test -f dist/assets/previews/template-05.jpg || { echo "::error::preview 05 missing"; exit 1; }

          # Underscore paths are what Jekyll would drop; .nojekyll prevents it,
          # but confirm the file actually shipped.
          test -f dist/templates/05-neighbourhood/js/pages/_page.js             || { echo "::error::_page.js missing — Template 05 will not boot"; exit 1; }
          test -f dist/templates/02-playful-celebration/js/pages/_page.js       || { echo "::error::_page.js missing — Template 02 will not boot"; exit 1; }
          test -f dist/templates/02-playful-celebration/js/components/cake.js   || { echo "::error::cake.js missing — Template 02 has no builder"; exit 1; }
          test -f dist/templates/03-romantic-boutique/js/pages/_page.js       || { echo "::error::_page.js missing — Template 03 will not boot"; exit 1; }
          test -f dist/templates/03-romantic-boutique/js/card.js               || { echo "::error::card.js missing — Template 03 cannot typeset a card"; exit 1; }
          test -f dist/templates/04-creative-studio/js/pages/_page.js         || { echo "::error::_page.js missing — Template 04 will not boot"; exit 1; }
          test -f dist/templates/04-creative-studio/js/commission.js         || { echo "::error::commission.js missing — Template 04 cannot price"; exit 1; }
          test -f dist/shared/session.js                                        || { echo "::error::shared/session.js missing — no template will boot"; exit 1; }

          # Development files must not reach the public site.
          if find dist \( -name package.json -o -name tests -o -name node_modules \) | grep .; then
            echo "::error::development files leaked into dist"
            exit 1
          fi

          echo "pages:     $(find dist -name '*.html' | wc -l)"
          echo "templates: $(ls dist/templates | paste -sd' ')"
          echo "images:    $(ls dist/shared/img | wc -l)"
          echo "size:      $(du -sh dist | cut -f1)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
